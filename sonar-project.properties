sonar.projectKey=inventory-oms
sonar.projectName=Inventory & Order Management
sonar.sourceEncoding=UTF-8

# Kode aplikasi yang dianalisis
sonar.sources=app,views,public/assets,config,scripts
sonar.tests=tests
sonar.exclusions=vendor/**,public/uploads/**

# Laporan hasil PHPUnit (dibuat oleh sonar.ps1)
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml
